<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Payment Card Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f3f4;
      color: #202124;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .banner {
      background: #fce8e6;
      color: #c5221f;
      text-align: center;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid #fad2cf;
    }

    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 32px 24px;
      flex-wrap: wrap;
    }

    .form-panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.15), 0 4px 8px rgba(60, 64, 67, 0.1);
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #5f6368;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #5f6368;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      margin-bottom: 18px;
      background: #fff;
    }

    input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }

    .row {
      display: flex;
      gap: 16px;
    }

    .row > div {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      background: #1a73e8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 8px;
    }

    button:hover {
      background: #1765cc;
    }

    .result {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .result.success {
      background: #e6f4ea;
      border: 1px solid #ceead6;
      color: #137333;
    }

    .result.error {
      background: #fce8e6;
      border: 1px solid #fad2cf;
      color: #c5221f;
    }

    .result pre {
      background: rgba(0, 0, 0, 0.04);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
      margin-top: 8px;
    }

    .preview-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .card-preview {
      width: 340px;
      height: 200px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1a73e8, #174ea6);
      color: #fff;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 20px rgba(26, 115, 232, 0.3);
    }

    .card-chip {
      width: 44px;
      height: 32px;
      border-radius: 6px;
      background: linear-gradient(135deg, #f5d76e, #d4a017);
      opacity: 0.9;
    }

    .card-number {
      font-size: 22px;
      letter-spacing: 2px;
      font-family: "Courier New", monospace;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
      margin-bottom: 2px;
    }

    #preview-name,
    #preview-expiry {
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .hint {
      font-size: 13px;
      color: #5f6368;
      text-align: center;
      max-width: 340px;
    }

    @media (max-width: 800px) {
      .container {
        flex-direction: column-reverse;
        gap: 32px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="form-panel">
      <h1>Add payment method</h1>

      <form id="card-form" method="POST" action="/submit" novalidate>
        <label for="card-number">Card number</label>
        <input id="card-number" name="card-number" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242" />

        <label for="card-name">Name on card</label>
        <input id="card-name" name="card-name" type="text" autocomplete="cc-name" placeholder="Cardholder Name" />

        <div class="row">
          <div>
            <label for="expiry">Expiry (MM/YY)</label>
            <input id="expiry" name="expiry" type="text" inputmode="numeric" autocomplete="cc-exp" placeholder="12/30" />
          </div>
          <div>
            <label for="cvv">CVV</label>
            <input id="cvv" name="cvv" type="text" inputmode="numeric" autocomplete="cc-csc" placeholder="123" />
          </div>
        </div>

        <button type="submit">Add card</button>
      </form>

      <div id="result" class="result" hidden></div>
    </div>

    <div class="preview-panel">
      <div class="card-preview">
        <div class="card-chip"></div>
        <div class="card-number" id="preview-number">•••• •••• •••• ••••</div>
        <div class="card-bottom">
          <div>
            <div class="label">Cardholder</div>
            <div id="preview-name">YOUR NAME</div>
          </div>
          <div>
            <div class="label">Expires</div>
            <div id="preview-expiry">MM/YY</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('card-form');
    const cardInput = document.getElementById('card-number');
    const nameInput = document.getElementById('card-name');
    const expiryInput = document.getElementById('expiry');
    const cvvInput = document.getElementById('cvv');
    const previewNumber = document.getElementById('preview-number');
    const previewName = document.getElementById('preview-name');
    const previewExpiry = document.getElementById('preview-expiry');
    const resultDiv = document.getElementById('result');

    function formatCardNumber(value) {
      const digits = value.replace(/\D/g, '').slice(0, 19);
      return digits.replace(/(\d{4})(?=\d)/g, '$1 ');
    }

    function formatExpiry(value) {
      const digits = value.replace(/\D/g, '').slice(0, 4);
      if (digits.length >= 3) {
        return digits.slice(0, 2) + '/' + digits.slice(2);
      }
      return digits;
    }

    function luhnCheck(num) {
      const digits = num.replace(/\D/g, '');
      let sum = 0;
      let double = false;
      for (let i = digits.length - 1; i >= 0; i--) {
        let d = parseInt(digits[i], 10);
        if (double) {
          d *= 2;
          if (d > 9) d -= 9;
        }
        sum += d;
        double = !double;
      }
      return sum % 10 === 0;
    }

    function updatePreview() {
      const num = cardInput.value.replace(/\D/g, '');
      if (num) {
        previewNumber.textContent = formatCardNumber(num);
      } else {
        previewNumber.textContent = '•••• •••• •••• ••••';
      }
      previewName.textContent = nameInput.value.trim()
        ? nameInput.value.trim().toUpperCase()
        : 'YOUR NAME';
      previewExpiry.textContent = expiryInput.value || 'MM/YY';
    }

    cardInput.addEventListener('input', (e) => {
      e.target.value = formatCardNumber(e.target.value);
      updatePreview();
    });

    expiryInput.addEventListener('input', (e) => {
      e.target.value = formatExpiry(e.target.value);
      updatePreview();
    });

    nameInput.addEventListener('input', updatePreview);
  </script>
</body>
</html>
